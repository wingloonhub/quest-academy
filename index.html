<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#070b1a" />
<title>Quest Academy</title>

<!-- ===== PWA: installable on iPhone (Add to Home Screen) and Android (Install) ===== -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/svg+xml" sizes="any" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="mask-icon" href="favicon.svg" color="#f2c14e" />

<!-- iOS — open standalone (no Safari chrome) when added to the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Quest Academy" />
<meta name="application-name" content="Quest Academy" />
<meta name="format-detection" content="telephone=no" />

<link rel="preconnect" href="https://www.gstatic.com" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Screens are injected by js/ui.js -->
    <div id="screen" class="screen"></div>
    <div id="toast-host"></div>
  </div>

  <!-- Firebase (compat build = no bundler / no build step needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- App code (plain script tags, loaded in order — no build step) -->
  <script src="js/firebase-config.js"></script>
  <script src="js/art.js"></script>
  <script src="js/questions/english.js"></script>
  <script src="js/questions/bahasa.js"></script>
  <script src="js/questions/maths.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/report.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
